<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>JCI – Contact Us</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="style.css">
</head>
<body>

<header class="navbar">
  <a href="home.html" class="navbar-logo">
      <img src="assets/images/logo.png" width="24" alt="JCI">
      <div>JCI</div>
  </a>

  <div class="hamburger" id="hamburger">
      &#9776;
  </div>

  <nav class="nav-links" id="navMenu">
      <a href="home.html">Home</a>
      <a href="product.html">Products</a>
      <a href="forum.html">Forum</a>
      <a href="store.html">Store</a>
      <a href="contact.html">Contact Us</a>
  </nav>
</header>


<section class="contact-wrap">
  <h1>Contact Us</h1>
   <p class="contact-sub">
    Need flight support, activation help, or troubleshooting?
    Send us a message and our team will get back to you.
  </p>

  <form id="contact-form" novalidate>
     <div class="form-field">
      <label for="fullName" class="form-label">Full Name</label>
      <input type="text" id="fullName" class="form-input">
      <div id="nameError" class="error-message"></div>
    </div>

    <div class="form-field">
      <label for="email" class="form-label">Email</label>
      <input type="text" id="email" class="form-input">
      <div id="emailError" class="error-message"></div>
    </div>

    <div class="form-field">
      <label for="phone" class="form-label">Phone</label>
      <input type="text" id="phone" class="form-input">
      <div id="phoneError" class="error-message"></div>
    </div>

    <div class="form-field">
      <label for="country" class="form-label">Country</label>
      <select id="country" class="form-select">
        <option value="">Select your country</option>
        <option value="Indonesia">Indonesia</option>
        <option value="Singapore">Singapore</option>
        <option value="Malaysia">Malaysia</option>
        <option value="Other">Other</option>
      </select>
      <div id="countryError" class="error-message"></div>
    </div>

    <div class="form-field">
      <label for="message" class="form-label">Message</label>
      <textarea id="message" class="form-textarea"></textarea>
      <div id="messageError" class="error-message"></div>
    </div>

    <div class="form-field">
      <div class="checkbox-row">
        <input type="checkbox" id="terms">
        <label for="terms">I agree to the Terms of Service and how JCI handles my data.</label>
       </div>
      <div id="termsError" class="error-message"></div>
    </div>

    <button type="submit" class="submit-btn">Submit</button>
  </form>
</section>

<footer>
  © 2025 JCI. All rights reserved.
</footer>

<script src="script.js"></script>
</body>
</html>
